workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Generate localizations
        script: flutter gen-l10n
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build APK
        script: flutter build apk --release
      - name: Build Web
        script: flutter build web --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/web/**

  web-deploy:
    name: Web Preview Deploy
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - flutter pub get
      - flutter gen-l10n
      - flutter build web --release
    artifacts:
      - build/web/**